substitutions:
  _ENV_PREFIX: 'develop'
  _REGION: 'asia-northeast1'
  _IMAGE_BASE: 'asia-northeast1-docker.pkg.dev'
  _REPO_PATH: 'ap-repo/ap-mv'
  _WEB_SERVICE_NAME: 'ap-mv'
  _WORKER_SERVICE_NAME: 'ap-mv-worker'
  _TAG: '${_ENV_PREFIX}-${SHORT_SHA}'
  _CACHE_TAG: '${_ENV_PREFIX}-latest'
  _GEMINI_MODELS: 'gemini-3.6-flash,gemini-3.1-pro-preview'
  _IMAGE_MODELS: 'gemini-3.1-flash-image,gemini-3-pro-image'
  _VEO_MODELS: 'veo-3.1-generate-001,veo-3.1-fast-generate-001'
  _VEO_MODEL: 'veo-3.1-generate-001'
  _VEO_OUTPUT_PREFIX: 'veo'

steps:
  - name: 'gcr.io/cloud-builders/docker'
    id: 'Setup Buildx'
    args: ['buildx', 'create', '--driver', 'docker-container', '--name', 'builder', '--use']

  - name: 'gcr.io/cloud-builders/docker'
    id: 'Build Container Image with Cache'
    args:
      - 'buildx'
      - 'build'
      - '-t'
      - '${_IMAGE_BASE}/${PROJECT_ID}/${_REPO_PATH}:${_ENV_PREFIX}-${SHORT_SHA}'
      - '-t'
      - '${_IMAGE_BASE}/${PROJECT_ID}/${_REPO_PATH}:${_CACHE_TAG}'
      - '--cache-from'
      - 'type=registry,ref=${_IMAGE_BASE}/${PROJECT_ID}/${_REPO_PATH}:buildcache'
      - '--cache-to'
      - 'type=registry,ref=${_IMAGE_BASE}/${PROJECT_ID}/${_REPO_PATH}:buildcache,mode=max'
      - '--push'
      - '.'

  - name: 'gcr.io/cloud-builders/gcloud'
    id: 'Deploy Worker to Cloud Run'
    entrypoint: 'gcloud'
    args:
      - 'run'
      - 'deploy'
      - '${_WORKER_SERVICE_NAME}'
      - '--image=${_IMAGE_BASE}/${PROJECT_ID}/${_REPO_PATH}:${_ENV_PREFIX}-${SHORT_SHA}'
      - '--region=${_REGION}'
      - '--platform=managed'
      - '--no-allow-unauthenticated'
      - '--memory=1Gi'
      - '--cpu=2'
      - '--execution-environment=gen2'
      - '--timeout=3600'
      - '--concurrency=4'
      - '--max-instances=5'
      - '--update-env-vars'
      - '^|^GCP_PROJECT_ID=${PROJECT_ID}|GCP_LOCATION_ID=${_REGION}|GEMINI_MODELS=${_GEMINI_MODELS}|IMAGE_MODELS=${_IMAGE_MODELS}|VEO_MODEL=${_VEO_MODEL}|VEO_MODELS=${_VEO_MODELS}|VEO_OUTPUT_PREFIX=${_VEO_OUTPUT_PREFIX}|SERVER_ROLE=worker|SERVICE_URL=https://${_WEB_SERVICE_NAME}-${PROJECT_NUMBER}.${_REGION}.run.app|WORKER_URL=https://${_WORKER_SERVICE_NAME}-${PROJECT_NUMBER}.${_REGION}.run.app/tasks/generate|TASK_AUDIENCE_URL=https://${_WORKER_SERVICE_NAME}-${PROJECT_NUMBER}.${_REGION}.run.app'

  - name: 'gcr.io/cloud-builders/gcloud'
    id: 'Deploy Web to Cloud Run'
    entrypoint: 'gcloud'
    args:
      - 'run'
      - 'deploy'
      - '${_WEB_SERVICE_NAME}'
      - '--image=${_IMAGE_BASE}/${PROJECT_ID}/${_REPO_PATH}:${_ENV_PREFIX}-${SHORT_SHA}'
      - '--region=${_REGION}'
      - '--platform=managed'
      - '--allow-unauthenticated'
      - '--memory=512Mi'
      - '--cpu=1'
      - '--execution-environment=gen2'
      - '--timeout=300'
      - '--concurrency=20'
      - '--max-instances=5'
      - '--update-env-vars'
      - '^|^GCP_PROJECT_ID=${PROJECT_ID}|GCP_LOCATION_ID=${_REGION}|GEMINI_MODELS=${_GEMINI_MODELS}|IMAGE_MODELS=${_IMAGE_MODELS}|VEO_MODEL=${_VEO_MODEL}|VEO_MODELS=${_VEO_MODELS}|VEO_OUTPUT_PREFIX=${_VEO_OUTPUT_PREFIX}|SERVER_ROLE=web|WORKER_URL=https://${_WORKER_SERVICE_NAME}-${PROJECT_NUMBER}.${_REGION}.run.app/tasks/generate|TASK_AUDIENCE_URL=https://${_WORKER_SERVICE_NAME}-${PROJECT_NUMBER}.${_REGION}.run.app'

options:
  machineType: 'E2_HIGHCPU_8'
  logging: CLOUD_LOGGING_ONLY
