substitutions:
  _ENV_PREFIX: 'develop'
  _REGION: 'asia-northeast1'
  _IMAGE_BASE: 'asia-northeast1-docker.pkg.dev'
  _REPO_PATH: 'ap-repo/ap-mv'
  _SERVICE_NAME: 'ap-mv'
  _TAG: '${_ENV_PREFIX}-${SHORT_SHA}'
  _CACHE_TAG: '${_ENV_PREFIX}-latest'
  _GEMINI_MODELS: 'gemini-3.6-flash,gemini-3.1-pro-preview'
  _IMAGE_MODELS: 'gemini-3.1-flash-image,gemini-3-pro-image'
  _VEO_MODELS: 'veo-3.1-generate-001,veo-3.1-fast-generate-001'
  _VEO_MODEL: 'veo-3.1-generate-001'
  _VEO_OUTPUT_PREFIX: 'veo'

steps:
  - name: 'gcr.io/cloud-builders/docker'
    id: 'Setup Buildx'
    args: ['buildx', 'create', '--driver', 'docker-container', '--name', 'builder', '--use']

  - name: 'gcr.io/cloud-builders/docker'
    id: 'Build Container Image with Cache'
    args:
      - 'buildx'
      - 'build'
      - '-t'
      - '${_IMAGE_BASE}/${PROJECT_ID}/${_REPO_PATH}:${_ENV_PREFIX}-${SHORT_SHA}'
      - '-t'
      - '${_IMAGE_BASE}/${PROJECT_ID}/${_REPO_PATH}:${_CACHE_TAG}'
      - '--cache-from'
      - 'type=registry,ref=${_IMAGE_BASE}/${PROJECT_ID}/${_REPO_PATH}:buildcache'
      - '--cache-to'
      - 'type=registry,ref=${_IMAGE_BASE}/${PROJECT_ID}/${_REPO_PATH}:buildcache,mode=max'
      - '--push'
      - '.'

  - name: 'gcr.io/cloud-builders/gcloud'
    id: 'Deploy to Cloud Run'
    entrypoint: 'gcloud'
    args:
      - 'run'
      - 'deploy'
      - '${_SERVICE_NAME}'
      - '--image=${_IMAGE_BASE}/${PROJECT_ID}/${_REPO_PATH}:${_ENV_PREFIX}-${SHORT_SHA}'
      - '--region=${_REGION}'
      - '--platform=managed'
      - '--allow-unauthenticated'
      - '--memory=4Gi'
      # 第2世代: ffmpeg（静的バイナリを exec）のデコード・エンコードと、GCS との
      # 動画の往復が処理の大半を占める。第1世代の gVisor はシステムコール介在の
      # オーバーヘッドが I/O 主体の処理で効いてくる上、Linux 互換も部分的。
      # 引き換えのコールドスタート増は、1リクエストが数分かかる本サービスでは誤差。
      - '--execution-environment=gen2'
      # VEO_OPERATION_TIMEOUT=20m / PIPELINE_TIMEOUT=45m を包含できる上限。
      # 既定の 300 秒だと、生成が5分を超えたカットでリクエストが打ち切られる。
      # Veo 側の生成は完走するため video_id を記録できず、Cloud Tasks の再配信で
      # 同じカットを生成し直すことになる（成功した生成がそのまま課金される）。
      - '--timeout=3600'
      # Cloud Run の /tmp はインメモリで、ffmpeg が落としてくる動画がそのまま
      # メモリ上限（4Gi）を消費する。既定の 80 並列は同時に数本重なった時点で
      # OOM になる。1ジョブ内の生成は逐次なので、これは並行ジョブ数の上限。
      - '--concurrency=5'
      - '--update-env-vars'
      - '^|^GCP_PROJECT_ID=${PROJECT_ID}|GCP_LOCATION_ID=${_REGION}|GEMINI_MODELS=${_GEMINI_MODELS}|IMAGE_MODELS=${_IMAGE_MODELS}|VEO_MODEL=${_VEO_MODEL}|VEO_MODELS=${_VEO_MODELS}|VEO_OUTPUT_PREFIX=${_VEO_OUTPUT_PREFIX}'

options:
  machineType: 'E2_HIGHCPU_8'
  logging: CLOUD_LOGGING_ONLY
