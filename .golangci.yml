version: "2"

run:
  timeout: 5m

linters:
  enable:
    - errcheck
    - govet
    - ineffassign
    - staticcheck
    - unused
    - gocritic
    - revive
  settings:
    errcheck:
      exclude-functions:
        - (io.ReadCloser).Close
  exclusions:
    rules:
      # Disable staticcheck's SA5011 in _test.go.
      #
      # Dereferencing x after `if x == nil { t.Fatal(...) }` is a common idiom in Go
      # tests and is not a nil dereference. That t.Fatal does not return is part of
      # the testing package's contract (Fatal calls FailNow, and FailNow calls
      # runtime.Goexit to stop execution). In other words, the code is correct.
      #
      # But staticcheck on CI sometimes misses the analysis result (facts) that
      # "Fatal does not return", and then reports a false positive. Facts only
      # matter for *re-analysed packages*, so the symptom "appears in the package
      # you changed, and moves to the next package you change once fixed".
      # On 2026-08-05 we tried clearing the cache, rewriting the affected code and
      # adopting testify in turn; each only moved the warning and none settled it.
      #
      # It stays enabled for production code. A nil dereference in a test shows up
      # immediately as a panic at run time, so little is lost by excluding it here.
      - path: _test\.go
        linters:
          - staticcheck
        text: "SA5011"

formatters:
  enable:
    - gofmt
    - goimports
