{{define "content"}}
<div class="row justify-content-center">
    <div class="col-12 col-lg-9">
        <div class="card border-0 shadow-sm">
            <div class="card-body p-4 p-md-5">
                <h1 class="h3 fw-bold mb-4">Video Recipe Create</h1>
                <form method="post" action="/web/video-recipe-create">
                    <input type="hidden" id="csrf_token" name="csrf_token" value="{{.CSRFToken}}">

                    <div class="mb-3">
                        <label class="form-label fw-semibold">URL</label>
                        <input class="form-control" name="url" placeholder="https://example.com/source">
                    </div>
                    <div class="mb-3">
                        <label class="form-label fw-semibold">Text</label>
                        <textarea class="form-control" name="text" rows="8" placeholder="原稿、コンセプト、歌詞の方向性など"></textarea>
                    </div>
                    <div class="mb-3">
                        <label class="form-label fw-semibold">Image URL</label>
                        <input class="form-control" name="image_url" placeholder="https://example.com/reference.png">
                    </div>
                    {{if .Characters}}
                    <div class="mb-3">
                        <label class="form-label fw-semibold">Character</label>
                        <select class="form-select" name="character_id">
                            {{range .Characters}}
                            <option value="{{.ID}}" {{if eq .ID $.SelectedCharacterID}}selected{{end}}>{{.Name}} ({{.ID}})</option>
                            {{end}}
                        </select>
                    </div>
                    {{end}}
                    <div class="mb-3">
                        <label class="form-label fw-semibold">Music Audio GCS URL</label>
                        <input class="form-control" name="audio_url" placeholder="gs://bucket/path/music.mp3">
                    </div>

                    <div class="row g-3">
                        <div class="col-12 col-md-6">
                            <label class="form-label fw-semibold">Gemini Model</label>
                            <select class="form-select" name="text_model">
                                {{range .GeminiModels}}
                                <option value="{{.}}" {{if eq . $.SelectedGeminiModel}}selected{{end}}>{{.}}</option>
                                {{end}}
                            </select>
                        </div>
                        <div class="col-12 col-md-6">
                            <label class="form-label fw-semibold">Image Model</label>
                            <select class="form-select" name="image_model">
                                {{range .ImageModels}}
                                <option value="{{.}}" {{if eq . $.SelectedImageModel}}selected{{end}}>{{.}}</option>
                                {{end}}
                            </select>
                        </div>
                    </div>

                    <button class="btn btn-primary mt-4" type="submit">Queue Video Recipe Create</button>
                </form>
            </div>
        </div>
    </div>
</div>
{{end}}
