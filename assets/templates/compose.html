{{define "content"}}
<div class="row justify-content-center">
    <div class="col-12 col-lg-9">
        <div class="card border-0 shadow-sm">
            <div class="card-body p-4 p-md-5">
                <h1 class="h3 fw-bold mb-4">Video Recipe Create</h1>
                <form method="post" action="/web/video-recipe-create">
                    <input type="hidden" id="csrf_token" name="csrf_token" value="{{.CSRFToken}}">

                    <div class="mb-3">
                        <label class="form-label fw-semibold">Music Job ID</label>
                        <input class="form-control" name="music_job_id" placeholder="20260711132823-256e9128">
                    </div>
                    <div class="mb-3">
                        <label class="form-label fw-semibold">Aspect Ratio</label>
                        <select class="form-select" name="aspect_ratio">
                            <option value="16:9" selected>16:9</option>
                            <option value="9:16">9:16 (ショート)</option>
                        </select>
                        <div class="form-text">キーフレーム作成時に一度だけ決まります。以降の動画生成（フルMV・ショート・カット再生成）はこの値を引き継ぎ、選び直すことはできません。</div>
                    </div>
                    {{if .VisualModes}}
                    <div class="mb-3">
                        <label class="form-label fw-semibold">Visual Mode</label>
                        <select class="form-select" name="visual_mode">
                            {{range .VisualModes}}
                            <option value="{{.ID}}" {{if eq .ID $.SelectedVisualMode}}selected{{end}}>{{.Name}}</option>
                            {{end}}
                        </select>
                    </div>
                    {{end}}
                    {{if .Characters}}
                    <div class="mb-3">
                        <label class="form-label fw-semibold">Character</label>
                        <select class="form-select" name="character_id">
                            {{range .Characters}}
                            <option value="{{.ID}}" {{if eq .ID $.SelectedCharacterID}}selected{{end}}>{{.Name}} ({{.ID}})</option>
                            {{end}}
                        </select>
                    </div>
                    {{end}}
                    <div class="row g-3">
                        <div class="col-12 col-md-6">
                            <label class="form-label fw-semibold">Gemini Model</label>
                            <select class="form-select" name="text_model">
                                {{range .GeminiModels}}
                                <option value="{{.}}" {{if eq . $.SelectedGeminiModel}}selected{{end}}>{{.}}</option>
                                {{end}}
                            </select>
                        </div>
                        <div class="col-12 col-md-6">
                            <label class="form-label fw-semibold">Image Model</label>
                            <select class="form-select" name="image_model">
                                {{range .ImageModels}}
                                <option value="{{.}}" {{if eq . $.SelectedImageModel}}selected{{end}}>{{.}}</option>
                                {{end}}
                            </select>
                        </div>
                    </div>

                    <div class="d-flex flex-wrap gap-2 mt-4">
                        <button class="btn btn-primary" type="submit">Queue Video Recipe Create</button>
                        <button class="btn btn-outline-primary" type="submit" formaction="/web/compose-draft">
                            下書きだけ作る
                        </button>
                    </div>
                    <div class="form-text mt-2">
                        「下書きだけ作る」はカット割りまでで止まり、キーフレーム画像を1枚も生成しません。
                        カット数と尺を <a href="/web/drafts">Drafts</a> で確認してから本生成へ進めます。
                    </div>
                </form>
            </div>
        </div>
    </div>
</div>
{{end}}
