{{define "content"}}
<div class="row justify-content-center">
    <div class="col-12 col-lg-8">
        <!-- ジョブ ID はスクリプトへ data 属性で渡します（/static/js/job_status.js）。 -->
        <div class="card border-0 shadow-sm" id="job-status-panel" data-job-id="{{.JobID}}">
            <div class="card-body p-4 p-md-5">
                <div class="d-flex align-items-center gap-3 mb-4">
                    <i id="job-status-icon" class="bi bi-check-circle-fill text-success fs-2"></i>
                    <div>
                        <h1 class="h3 fw-bold mb-1"><i class="bi bi-hourglass-split me-2" aria-hidden="true"></i>Queued</h1>
                        <p class="text-muted mb-0">非同期パイプラインに投入しました。</p>
                    </div>
                </div>
                <dl class="row mb-4">
                    <dt class="col-sm-3">Job ID</dt>
                    <dd class="col-sm-9"><code>{{.JobID}}</code></dd>
                    <dt class="col-sm-3">Status</dt>
                    <dd class="col-sm-9">
                        <span id="job-status-state" class="badge text-bg-secondary">{{.Status}}</span>
                        <span id="job-status-spinner" class="spinner-border spinner-border-sm text-secondary ms-2" role="status" aria-hidden="true"></span>
                        <div id="job-status-error" class="text-danger small mt-2 d-none"></div>
                    </dd>
                </dl>
                <div class="d-flex flex-wrap gap-2">
                    <a id="job-status-history-link" class="btn btn-success d-none" href="/history/{{.JobID}}">結果を見る</a>
                    <a class="btn btn-primary" href="/video-recipe-create">Create Another</a>
                    <a class="btn btn-outline-secondary" href="/">Back Home</a>
                </div>
            </div>
        </div>
    </div>
</div>

{{end}}
