<!doctype html>
<html lang="ja">
<head>
    <meta charset="utf-8">
    <meta name="viewport" content="width=device-width, initial-scale=1">
    <title>{{.Title}} - AP MV</title>
    <style>
        body{font-family:ui-sans-serif,system-ui;margin:0;background:#f4f9f1;color:#172033}
        .wrap{max-width:880px;margin:48px auto;padding:0 20px}
        .card{background:#fff;border:1px solid #cfe4be;border-radius:20px;padding:28px;box-shadow:0 8px 30px #263b1a12}
        label{display:block;font-weight:700;margin:16px 0 6px}
        input,textarea{width:100%;box-sizing:border-box;border:1px solid #bdd7aa;border-radius:12px;padding:12px;font:inherit}
        textarea{min-height:220px}
        button,a.btn{display:inline-block;margin-top:18px;background:#689f38;color:#fff;border:0;border-radius:12px;padding:12px 18px;text-decoration:none;font-weight:700}
        .nav{color:#558b2f;text-decoration:none}
    </style>
</head>
<body>
    <main class="wrap">
        <a class="nav" href="/">AP MV</a>
        <section class="card">
            <h1>{{.Title}}</h1>
            {{.Body}}
        </section>
    </main>
</body>
</html>
