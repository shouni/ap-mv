{{define "content"}}
<div class="row justify-content-center">
    <div class="col-12 col-lg-9">
        <div class="card border-0 shadow-sm">
            <div class="card-body p-4 p-md-5">
                <h1 class="h3 fw-bold mb-4">MV From Keyframe Video Recipe</h1>
                <form method="post" action="/web/mv-from-keyframe-video-recipe">
                    <input type="hidden" id="csrf_token" name="csrf_token" value="{{.CSRFToken}}">
                    <div class="mb-3">
                        <label class="form-label fw-semibold">Keyframe VideoRecipe GCS URL</label>
                        <input class="form-control" name="recipe_url" placeholder="gs://bucket/path/video_music_meta.json">
                    </div>
                    <div class="mb-3">
                        <label class="form-label fw-semibold">Music Audio GCS URL</label>
                        <input class="form-control" name="audio_url" placeholder="gs://bucket/path/music.mp3">
                    </div>
                    {{if .Characters}}
                    <div class="mb-3">
                        <label class="form-label fw-semibold">Character Override</label>
                        <select class="form-select" name="character_id">
                            {{range .Characters}}
                            <option value="{{.ID}}" {{if eq .ID $.SelectedCharacterID}}selected{{end}}>{{.Name}} ({{.ID}})</option>
                            {{end}}
                        </select>
                    </div>
                    {{end}}
                    <div class="mb-3">
                        <label class="form-label fw-semibold">Keyframe VideoRecipe JSON</label>
                        <textarea class="form-control" name="recipe_json" rows="12" placeholder='{"title":"...","cuts":[{"cut_index":1,"duration_sec":8,"visual_anchor":"...","keyframe_reference":"gs://.../keyframe_01.png"}]}'></textarea>
                    </div>
                    <button class="btn btn-primary" type="submit">Queue MV Generation</button>
                </form>
            </div>
        </div>
    </div>
</div>
{{end}}
